<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Escape Rooms - Ciudades</title>
</head>

<body>
    <h1>Listado de las ciudades</h1>
    <div id="listado_ciudades">
        <p>Cargando....</p>
    </div>
    <button class="btn btn-success mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#cajaFormulario">
        Añadir Nueva Ciudad
    </button>

    <div class="collapse mb-4" id="cajaFormulario">
        <div class="card card-body">
            <div class="mb-3">
                <label for="input_nueva_ciudad" class="form-label">Nombre de la ciudad</label>
                <input type="text" class="form-control" id="input_nueva_ciudad" placeholder="Ej: Lugo, Salamanca...">
            </div>
            <div class="mb-3">
                <label for="input_nueva_zonaCiudad" class="form-label">Nombre de la zona</label>
                <input type="text" class="form-control" id="input_nueva_zonaCiudad" placeholder="Ej: Centro, Barrio...">
            </div>
            <button class="btn btn-primary" onclick="crearCiudad()">Guardar Ciudad</button>

        </div>
    </div>


    <div>
        <a class="btn btn-secondary" href="salas.html" role="button">Ir a Salas</a>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
