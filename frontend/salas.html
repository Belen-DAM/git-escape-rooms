<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Escape Rooms - Salas</title>
</head>

<body>
    <h1>Listado de las salas</h1>
    <div id="listado_salas">
        <p>Cargando....</p>
    </div>

    <button class="btn btn-success mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#cajaFormulario">
        Añadir Nueva Sala
    </button>

    <div class="collapse mb-4" id="cajaFormulario">
        <div class="card card-body">
            <div class="mb-3">
                <label for="input_nueva_sala" class="form-label">Nombre de la sala</label>
                <input type="text" class="form-control" id="input_nueva_sala" placeholder="Ej: Enigma de Goya, 007...">
                <label for="input_nueva_dificultad" class="form-label">Dificultad de la sala</label>
                <input type="text" class="form-control" id="input_nueva_dificultad" placeholder="Ej: 6/10">
                <label for="input_nueva_categoria" class="form-label">Categoría de la sala</label>
                <input type="text" class="form-control" id="input_nueva_categoria"
                    placeholder="Ej: Terror, Suspense, Aventura...">
                <label for="input_nuevo_jugadores" class="form-label">Número máximo de jugadores</label>
                <input type="text" class="form-control" id="input_nuevo_jugadores" placeholder="Ej: 8">
                <label for="input_nueva_tendencia" class="form-label">¿Es tendencia?</label>
                <input type="text" class="form-control" id="input_nueva_tendencia" placeholder="Ej: Sí">

                <div class="mb-3">
                    <label for="input_nueva_ciudad" class="form-label">Ciudad</label>
                    <select id="input_nueva_ciudad" class="form-select" aria-label="Desplegable para elegir ciudad">
                        <option selected>Abre el menú para elegir una ciudad</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary" onclick="crearSala()">Guardar Sala</button>

        </div>
    </div>



    <div>
        <a class="btn btn-secondary" href="index.html" role="button">Ir a Ciudades</a>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
